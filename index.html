<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screen" id="quiz-start">
            <h1 class="quiz-title">
                Quiz Time!
            </h1>
            <p class="quiz-text">
                Test your knowledge with these questions.
            </p>
            <button class="btn" id="start-btn">
                Start Quiz
            </button>

        </div>
        <div class="screen" id="quiz-screen">
            <h2 class="quiz-question" id="quiz-question">Question 1</h2>
            <div class="quiz-header">
                
                <p class="question-num">
                    Question <span class="question-id" id="q-id"></span> of <span class="total-questions" id="total-question-num"></span>
                </p>
                <p class="score-counter-container">
                    Score <span class="score-count" id="s-count"></span>
                </p>

            </div>
            
            <div class="question-option-container">
                <!-- <button class="ans-btn correct">Placeholder answer</button>
                <button class="ans-btn incorrect">Placeholder answer</button>
                <button class="ans-btn">Placeholder answer</button>
                <button class="ans-btn">Placeholder answer</button> -->
                


            </div>
            <div class="progress-bar-container">
                <div class="progress">

                </div>
            </div>


        </div>
        <div class="screen" id="quiz-results">
            <h2 class="quiz-results-title">
                Quiz Results 
            </h2>
            <div class="results-details">
                <p class="score-detail">
                    You scored <span class="score" id="result-score"></span> out of <span class="total" id="score-total"></span>
                    <h3 class="game-comment">

                    </h3>
                </p>
            </div>
            <button class="btn" id="restart-btn">
                Restart Quiz
            </button>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
